# Script Sentinel — Plus-only, read-only regression-testing app
# Keep all scopes read-only (Slice 1 architectural commitment).

name = "Script Sentinel"
client_id = "fb9981a0f053223f984058d9d0df143e"
application_url = "https://script-sentinel-ptkfe.ondigitalocean.app"
embedded = true

[access_scopes]
# READ-ONLY ONLY. Adding any write_* scope is a Slice 1 regression — the entire
# product premise is that we never modify checkout, discounts, scripts, or functions.
#
# Notes on the roadmap-listed scopes:
#   - `read_checkouts` is NOT a real Admin API scope as of API 2026-04. Abandoned-
#     checkout fields live under `read_orders`, so we drop it here.
#   - Script-discovery (Shopify Scripts admin object) does not have a `read_scripts`
#     scope and Admin-API access is unverified for the deprecation window. We will
#     revisit in Slice 2 with a merchant-paste fallback if needed. `read_script_tags`
#     is unrelated (storefront ScriptTag) and intentionally excluded from Slice 1.
scopes = "read_orders,read_products,read_discounts,read_locations,read_shipping"
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://script-sentinel-ptkfe.ondigitalocean.app/auth/callback",
]

[webhooks]
api_version = "2026-04"

  # Handled by: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  # Handled by: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  # GDPR mandatory compliance webhooks (Slice 9). Required for App Store
  # submission. Script Sentinel does not store customer-identifying data
  # (Slice 3 PII contract), so customers/* handlers acknowledge and return
  # 200; shop/redact hard-deletes the Shop row and cascades through every
  # related model.

  # Handled by: /app/routes/webhooks.customers.data_request.tsx
  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request"]
  uri = "/webhooks/customers/data_request"

  # Handled by: /app/routes/webhooks.customers.redact.tsx
  [[webhooks.subscriptions]]
  compliance_topics = ["customers/redact"]
  uri = "/webhooks/customers/redact"

  # Handled by: /app/routes/webhooks.shop.redact.tsx
  [[webhooks.subscriptions]]
  compliance_topics = ["shop/redact"]
  uri = "/webhooks/shop/redact"

[build]
automatically_update_urls_on_dev = true
name = "remix"
roles = ["frontend", "backend"]
webhooks_path = "/webhooks/app/uninstalled"
